# ---------------------------------------------------------------------------
# Known upstreams with NO interface in this catalog. That is the whole
# meaning of this section, and it is why an agent with an interface but no
# realization is NOT here -- it carries `realization_blocked` on its
# `[[agent]]` entry instead. Listing it in both places is how a coverage
# report starts contradicting itself: one section says packaged, the other
# says uncovered, and whichever is read first wins.
#
# One row per upstream. `tests/test_llm_agent_catalog.nim` fails on a
# duplicate, on a name that appears in both sections, and on a name here
# that has an interface after all.
# ---------------------------------------------------------------------------

[[uncovered]]
name = "amp"
homepage = "https://ampcode.com"
observed_pin = "0.0.1782120930-g64087b"
reason = """
npm-only, and unlike gemini-cli and qwen-code this one genuinely needs a
dependency closure. `@sourcegraph/amp` is an 895-byte wrapper: it declares
one dependency, `@ampcode/cli`, and its `bin` points at
`node_modules/@ampcode/cli/bin/amp.exe` -- a platform-specific NATIVE binary
reached through npm's optional-dependency mechanism. Resolving that means
reading a lockfile and selecting per platform, which is the larger of the two
npm shapes.

Its version scheme is also not semver, so the interface's version constraint
grammar would need a decision before one could be written.
"""

