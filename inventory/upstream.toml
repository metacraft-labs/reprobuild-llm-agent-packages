"""

# ---------------------------------------------------------------------------
# Known upstreams with NO interface in this catalog. That is the whole
# meaning of this section, and it is why an agent with an interface but no
# realization is NOT here -- it carries `realization_blocked` on its
# `[[agent]]` entry instead. Listing it in both places is how a coverage
# report starts contradicting itself: one section says packaged, the other
# says uncovered, and whichever is read first wins.
#
# One row per upstream. `tests/test_llm_agent_catalog.nim` fails on a
# duplicate, on a name that appears in both sections, and on a name here
# that has an interface after all.
# ---------------------------------------------------------------------------

[[uncovered]]
name = "amp"
homepage = "https://ampcode.com"
observed_pin = "0.0.1782120930-g64087b"
reason = """
npm-only: the distribution is an npm package with no release binaries. Its
version scheme is also not semver, so the interface's version constraint
grammar would need a decision before one could be written.
"""

[[uncovered]]
name = "claude-code-acp"
homepage = "https://github.com/zed-industries/claude-code-acp"
observed_pin = "0.16.2"
reason = """
npm-only: the release carries no binary assets. It is also an ACP ADAPTER
rather than a coding-agent CLI -- it speaks the Agent Client Protocol to an
editor and drives Claude Code on the other side -- so a consumer composes it
WITH an agent rather than instead of one, and the protocol members that
category needs are not modelled yet. `codex-acp` is the same category and
DOES have an interface and a vendor realization, so the category is not the
obstacle here; the npm-only distribution is.
"""
