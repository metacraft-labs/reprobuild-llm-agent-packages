[[agent]]
name = "gemini-cli"
homepage = "https://github.com/google-gemini/gemini-cli"
provenance_class = "source-available"
source_available = true
main_programs = ["gemini"]
release_channel = "npm"
observed_pin = "0.59.0"
packaged = ["interface", "vendor"]
packaged_version = "0.59.0"
notes = """
Realized from the npm registry tarball, not from a release binary: upstream
publishes none at this pin (the GitHub release carries darwin archives only).

The closure was never the obstacle, though it was assumed to be.
`@google/gemini-cli@0.59.0` declares ZERO dependencies -- the published
tarball is a self-contained esbuild bundle, 20.7 MB compressed and 98 MB
unpacked, whose `bin` is `bundle/gemini.js` and which carries no
`node_modules` at all. Verified by `node bundle/gemini.js --version` ->
`0.59.0`.

What was missing was smaller and different: a way to express "the command is
a SCRIPT run by an interpreter". A realized prefix goes on PATH as a
directory, so the command's name there is a file's own name, and
`bundle/gemini.js` is not a program. reprobuild now has `launcher`, which
writes the launcher pair npm would have generated (`gemini` plus
`gemini.cmd`) under the name `executableAlias` gives; `executableAlias`
alone only ever gave one realized file a second NAME.

`node` is a requirement this package cannot express: the launcher resolves
its interpreter from PATH, so a recipe using this package must declare node.

sha256 of the registry tarball:
59dc2cdb098b3000d36e34a185fc873932df4fd9d00900e817f2b19cd349d98b

A from-source realization is still the primary one for an Apache-2.0 upstream
and belongs under `packages/source/gemini-cli/`; this entry sits alongside it
rather than standing in for it.
"""

[[agent]]
name = "qwen-code"
homepage = "https://github.com/QwenLM/qwen-code"
provenance_class = "source-available"
source_available = true
main_programs = ["qwen"]
release_channel = "npm"
observed_pin = "0.23.4"
packaged = ["interface", "vendor"]
packaged_version = "0.23.4"
notes = """
Realized from the npm registry tarball, for the same reasons as gemini-cli
and through the same `launcher` field. `@qwen-code/qwen-code@0.23.4` declares
zero dependencies and publishes a bundle whose `bin` is `cli-entry.js`, 110
MB unpacked. Verified by `node cli-entry.js --version` -> `0.23.4`.

Two differences from gemini-cli. The entry point sits at the package root
rather than under `bundle/`, so the launcher pair and the PATH entry are the
prefix root. And the tarball vendors ripgrep for four platforms under
`vendor/ripgrep/{arm64,x64}-{darwin,linux}/`; that is upstream's own layout
and is left alone, because the realized prefix should match the published
artifact and the saving is not why this package exists.

sha256 of the registry tarball:
d590c8e27fdd112cac4b0ce5ee98febdb91cf660c01db86ae431870f8ee41a9d
"""

[[agent]]
name = "claude-code-acp"
homepage = "https://github.com/zed-industries/claude-code-acp"
provenance_class = "source-available"
source_available = true
main_programs = ["claude-code-acp"]
release_channel = "npm"
observed_pin = "0.16.2"
packaged = ["interface", "vendor"]
packaged_version = "0.16.2"
notes = """
Realized from the npm registry tarball WITH ITS DEPENDENCY CLOSURE, which
is what distinguishes it from gemini-cli and qwen-code: those publish
self-contained bundles with zero dependencies and needed only a way to be
invoked, while `@zed-industries/claude-code-acp@0.16.2` is 174 KB and
declares five direct dependencies -- 97 transitive.

The closure is a committed manifest of pinned archives
(`packages/vendor/claude-code-acp/closures/claude-code-acp.manifest`),
generated from the transitive closure npm recorded in Agent Harbor's
`scripts/agent-tools/package-lock.json`. npm pins by sha512 `integrity`
and reprobuild verifies sha256, so each archive was fetched once and
hashed. The alternative -- an `npm install` build step -- would be a
version-range resolution and a network fetch inside a build, which is what
this catalog exists to remove.

It is an ACP ADAPTER rather than a coding-agent CLI: it speaks the Agent
Client Protocol to an editor and drives Claude Code on the other side, so a
consumer composes it WITH an agent rather than instead of one. The protocol
members that category needs are still not modelled, so its interface
declares one executable, exactly as `codex-acp` does.

`node` is a requirement this package cannot express: the launcher resolves
its interpreter from PATH, so a recipe using it must declare node.
"""

