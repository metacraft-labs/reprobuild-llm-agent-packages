# Machine-readable upstream inventory — M0 deliverable 4.
#
# This is a COVERAGE INPUT, not a source of package truth. It records what
# upstream projects exist, where their source and releases live, and what
# this catalog has packaged so far. A recipe is derived from the upstream
# project itself — its current source, release metadata, build instructions,
# licence and runtime behaviour — never from a line in this file.
#
# `packaged` says what this repository actually ships today and is the honest
# answer to "what is covered": `interface` means only the public interface
# exists, `vendor` means a pinned vendor-binary realization exists, `source`
# means a from-source realization exists. An entry may carry both.
#
# The `observed_pin` column records a version seen in a real consuming
# project, so the catalog can tell "nobody uses this" from "this is pinned
# somewhere and we have not covered it". The seed values come from Agent
# Harbor's `scripts/windows-devenv/toolchain-versions.env` on 2026-09-16 —
# the first consumer this catalog was built for, and the place these pins
# are currently maintained by hand.

schema = "reprobuild.llm-agent-catalog.inventory.v1"

[[agent]]
name = "claude-code"
homepage = "https://claude.com/claude-code"
provenance_class = "vendor-binary"
source_available = false
main_programs = ["claude"]
release_channel = "gcs-release-prefix"
observed_pin = "2.1.272"
packaged = ["interface", "vendor"]
packaged_version = "2.1.272"
notes = """
No corresponding source is published, so a source realization is not
reachable. The vendor payload is fetch-on-user-behalf and must not be
republished into a shared cache.
"""

[[agent]]
name = "codex"
homepage = "https://github.com/openai/codex"
provenance_class = "source-available"
source_available = true
main_programs = ["codex"]
release_channel = "github-release"
observed_pin = "0.154.0"
packaged = ["interface", "vendor"]
packaged_version = "0.154.0"

[[agent]]
name = "gemini-cli"
homepage = "https://github.com/google-gemini/gemini-cli"
provenance_class = "source-available"
source_available = true
main_programs = ["gemini"]
release_channel = "npm"
observed_pin = "0.59.0"
packaged = ["interface"]
realization_blocked = """
Upstream publishes no release binary at the pinned version -- the release
carries darwin archives only -- so the only distribution channel is npm, and
an npm package needs its dependency closure resolved and pinned. That is a
provisioning channel this catalog does not have yet, not a missing recipe.
"""

[[agent]]
name = "qwen-code"
homepage = "https://github.com/QwenLM/qwen-code"
provenance_class = "source-available"
source_available = true
main_programs = ["qwen"]
release_channel = "npm"
observed_pin = "0.23.4"
packaged = ["interface"]
realization_blocked = """
npm-only at the pinned version, for the same reason as gemini-cli.
"""

[[agent]]
name = "copilot"
homepage = "https://github.com/github/copilot-cli"
provenance_class = "vendor-binary"
source_available = false
main_programs = ["copilot"]
release_channel = "github-release"
observed_pin = "1.0.83"
packaged = ["interface", "vendor"]
packaged_version = "1.0.83"
notes = """
The consuming project installs this from npm, so unlike the other agents
here there was no independently harvested digest to cross-check the release
archives against.
"""

[[agent]]
name = "codex-acp"
homepage = "https://github.com/zed-industries/codex-acp"
provenance_class = "source-available"
source_available = true
main_programs = ["codex-acp"]
release_channel = "github-release"
observed_pin = "0.14.0"
packaged = ["interface", "vendor"]
packaged_version = "0.14.0"
notes = """
ACP ADAPTER, not a coding-agent CLI: it speaks the Agent Client Protocol to
an editor and drives Codex on the other side, so a consumer composes it WITH
an agent rather than instead of one. The protocol members that category will
declare are not modelled yet.
"""

[[agent]]
